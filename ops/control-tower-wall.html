<!--
  MODE: SANITIZED (M-01 open)
  Six-screen control-tower wall, v3 (2026-11-03). MOCKUP ON EXAMPLE DATA ONLY (made up; not company data).
  Self-adjusting: every screen is a CSS size container; panels re-flow by aspect ratio (wide >= 3:2, medium, tall <= 4:5) and every chart is an SVG
  scaled to fit its panel, so nothing scrolls or clips at any size.
  Controls: no hash = wall mode (all 6 on one display: 3x2 landscape, 2x3 portrait). #1..#6 = one screen full-window. Keys 1-6, 0/W = wall,
  arrows = prev/next, F = fullscreen. ?rotate=30 cycles screens every 30 s (minimum 5 s).
  Map selector (#map/<view>, ?view=3pl): P 3PL performance · I inventory health · T cutoff countdown · L lane cost · K carrier scorecard; D toggles the
  disruption overlay over any map view; replay slider (7/30 days, play/pause, Space, arrows). Views plug in through MapViews.register (view registry).
  Alert tiers: only CRITICAL blinks (1 Hz, under the 3 Hz flash limit): window closing in < 24 h (data-due), open order past promise date
  (data-promised), or port strike/closure active at a port holding our boxes (data-strike="active"). The screen holding it gets a slow red edge glow.
  Warnings glow steady amber. prefers-reduced-motion: no animation; critical items get a steady bold red outline.
  One self-contained file: no CDNs, no web fonts, no external requests. Not sent, not posted.
-->
<style>
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  :root { --bg:#000; --red:#ff4d4d; --amb:#ffb000; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; color:#f2f2f2; overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  svg text { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wall { position:fixed; inset:0; display:grid; gap:4px; padding:4px; background:#000;
    grid-template-columns:repeat(3, minmax(0,1fr)); grid-template-rows:repeat(2, minmax(0,1fr)); }
  @media (max-aspect-ratio: 1/1) { .wall { grid-template-columns:repeat(2, minmax(0,1fr)); grid-template-rows:repeat(3, minmax(0,1fr)); } }
  body.one .wall { padding:0; gap:0; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); }
  body.one .scr { display:none; } body.one .scr.on { display:grid; }
  .scr { container:scr / size; position:relative; min-width:0; min-height:0; overflow:hidden; background:#040506;
    border:1px solid #161b21; display:grid; grid-template-rows:auto minmax(0,1fr) auto; }
  body.one .scr { border:none; }
  .scr > svg.hd { display:block; width:100%; height:auto; max-height:8.5cqh; border-bottom:1px solid #161b21; }
  .scr > svg.ft { display:block; width:100%; height:auto; max-height:4cqh; border-top:1px solid #161b21; }
  .bd { display:grid; gap:min(0.8cqw, 1.2cqh); padding:min(0.8cqw, 1.2cqh); min-height:0; min-width:0; }
  .pn { min-width:0; min-height:0; overflow:hidden; background:#06080a; border:1px solid #11161c; }
  .pn > svg { display:block; width:100%; height:100%; }
  .s1 .bd { grid-template-areas:"a b" "c c"; grid-template-columns:.8fr 2fr; grid-template-rows:1fr 1fr; }
  @container scr (min-aspect-ratio: 3/2) { .s1 .bd { grid-template-areas:"a b" "a c"; grid-template-columns:.75fr 2fr; grid-template-rows:1fr 1fr; } }
  @container scr (max-aspect-ratio: 4/5) { .s1 .bd { grid-template-areas:"a" "b" "c"; grid-template-columns:1fr; grid-template-rows:.8fr 1fr 1fr; } }
  .s2 .bd { grid-template-areas:"a c" "b b"; grid-template-columns:1fr 1.3fr; grid-template-rows:1fr 1.3fr; }
  @container scr (min-aspect-ratio: 3/2) { .s2 .bd { grid-template-areas:"a b" "c b"; grid-template-columns:1fr 2.1fr; grid-template-rows:1.15fr 1fr; } }
  @container scr (max-aspect-ratio: 4/5) { .s2 .bd { grid-template-areas:"a" "b" "c"; grid-template-columns:1fr; grid-template-rows:1fr 1.4fr .8fr; } }
  .s3 .bd { grid-template-areas:"a a" "b c"; grid-template-columns:1fr 1fr; grid-template-rows:1.3fr 1fr; }
  @container scr (min-aspect-ratio: 3/2) { .s3 .bd { grid-template-areas:"a b" "a c"; grid-template-columns:1.6fr 1fr; grid-template-rows:1fr 1fr; } }
  @container scr (max-aspect-ratio: 4/5) { .s3 .bd { grid-template-areas:"a" "b" "c"; grid-template-columns:1fr; grid-template-rows:1.2fr .8fr .9fr; } }
  .s4 .bd { grid-template-areas:"a" "b" "c"; grid-template-columns:1fr; grid-template-rows:1fr 1.1fr .8fr; }
  @container scr (min-aspect-ratio: 3/2) { .s4 .bd { grid-template-areas:"a a" "b c"; grid-template-columns:1.35fr 1fr; grid-template-rows:1fr 1.1fr; } }
  @container scr (max-aspect-ratio: 4/5) { .s4 .bd { grid-template-areas:"a" "b" "c"; grid-template-columns:1fr; grid-template-rows:1fr 1.1fr .8fr; } }
  .s5 .bd { grid-template-areas:"a b" "c d"; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  @container scr (min-aspect-ratio: 3/2) { .s5 .bd { grid-template-areas:"a b d" "c c d"; grid-template-columns:.8fr 1.3fr 1.3fr; grid-template-rows:1fr 1fr; } }
  @container scr (max-aspect-ratio: 4/5) { .s5 .bd { grid-template-areas:"a" "b" "c" "d"; grid-template-columns:1fr; grid-template-rows:1fr 1fr .9fr 1.1fr; } }
  .sm .bd { grid-template-areas:"a" "b" "c"; grid-template-columns:1fr; grid-template-rows:1.05fr 1fr .14fr; }
  @container scr (min-aspect-ratio: 3/2) { .sm .bd { grid-template-areas:"a b" "c c"; grid-template-columns:1.75fr 1fr; grid-template-rows:1fr .17fr; } }
  @container scr (max-aspect-ratio: 4/5) { .sm .bd { grid-template-areas:"a" "b" "c"; grid-template-columns:1fr; grid-template-rows:.9fr 1fr .1fr; } }
  .s6 .bd { grid-template-areas:"a" "c" "b"; grid-template-columns:1fr; grid-template-rows:1fr 1fr 1fr; }
  @container scr (min-aspect-ratio: 3/2) { .s6 .bd { grid-template-areas:"a a" "b c"; grid-template-columns:1fr 1.6fr; grid-template-rows:1fr 1.2fr; } }
  @container scr (max-aspect-ratio: 4/5) { .s6 .bd { grid-template-areas:"a" "c" "b"; grid-template-columns:1fr; grid-template-rows:1fr 1fr 1fr; } }

  /* ---- motion: rings draw, bars grow, count-up (JS) ---- */
  @media (prefers-reduced-motion: no-preference) {
    .scr.go .draw { animation:draw 1.6s cubic-bezier(.2,.7,.2,1) both; }
    .scr.go .drawl { stroke-dasharray:100; animation:drawl 1.8s ease-out both; }
    .scr.go .grow { transform-box:fill-box; transform-origin:left center; animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both; }
    .scr.go .grow-y { transform-box:fill-box; transform-origin:center bottom; animation:growy 1.2s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes draw { from { stroke-dashoffset:var(--len); } to { stroke-dashoffset:var(--off); } }
    @keyframes drawl { from { stroke-dashoffset:100; } to { stroke-dashoffset:0; } }
    @keyframes grow { from { transform:scaleX(0); } }
    @keyframes growy { from { transform:scaleY(0); } }
  }
  /* ---- alert tiers ---- */
  .warn { filter:drop-shadow(0 0 4px rgba(255,176,0,.75)); }
  .mk.warn .halo { filter:drop-shadow(0 0 6px rgba(255,176,0,.8)); }
  .mk .pulse { opacity:0; }
  .row.crit .bg { fill:#3a0e0e; stroke:var(--red); stroke-width:2; }
  .scr.has-crit::after { content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 0 3px rgba(255,77,77,.85), inset 0 0 28px rgba(255,77,77,.35); }
  @media (prefers-reduced-motion: no-preference) {
    .row.crit .bg { animation:critbg 1s ease-in-out infinite; }
    .mk.crit .pulse { transform-box:fill-box; transform-origin:center; animation:pulse 1s ease-out infinite; }
    .mk.crit .halo { animation:critop 1s ease-in-out infinite; }
    .scr.has-crit::after { animation:edge 4s ease-in-out infinite; }
    @keyframes critbg { 0%,100% { fill:#6a1616; } 50% { fill:#1a0b0b; } }
    @keyframes critop { 0%,100% { fill-opacity:.45; } 50% { fill-opacity:.08; } }
    @keyframes pulse { 0% { opacity:.9; transform:scale(1); } 100% { opacity:0; transform:scale(2); } }
    @keyframes edge { 0%,100% { box-shadow:inset 0 0 0 3px rgba(255,77,77,.9), inset 0 0 34px rgba(255,77,77,.45); } 50% { box-shadow:inset 0 0 0 3px rgba(255,77,77,.3), inset 0 0 10px rgba(255,77,77,.1); } }
  }
  @media (prefers-reduced-motion: reduce) {
    .row.crit .bg { stroke-width:6; fill:#3a0e0e; }
    .mk.crit .halo { stroke-width:8; }
    .scr.has-crit::after { box-shadow:inset 0 0 0 6px var(--red); }
  }
  /* ---- map selector ---- */
  body:not(.one) #s7 { display:none; }
  .pick, .btn { cursor:pointer; }
  .iso-off { opacity:.07; }
  #mapSvg .mk.crit .pulse, #mapSvg .mk .pulse { pointer-events:none; }
  @media (prefers-reduced-motion: no-preference) {
    .flow { stroke-dasharray:7 7; animation:flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset:-14; } }
  }
  /* ---- controls (overlay; never takes layout space) ---- */
  #ctl { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); z-index:10; display:flex; gap:4px; align-items:center;
    background:rgba(4,6,8,.92); border:1px solid #2a323c; padding:5px; transition:opacity .4s; font:700 12px/1 system-ui, sans-serif; letter-spacing:.08em; }
  #ctl.hide { opacity:0; pointer-events:none; }
  #ctl button { background:#0d1116; color:#cfd8e3; border:1px solid #2a323c; padding:7px 10px; font:inherit; letter-spacing:inherit; cursor:pointer; }
  #ctl button.on { background:#f2f2f2; color:#000; }
  #ctl a.gal { background:#0d1116; color:#6fd3ff; border:1px solid #2a323c; padding:7px 10px; text-decoration:none; }
  #ctl #rot { color:#6fd3ff; padding:0 6px; }
  @media (max-width: 480px) { #ctl { font-size:10px; } #ctl button { padding:6px 6px; } }
